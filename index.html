<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cartelera de eventos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Cartelera de eventos</h1>
      <p>Lo que se viene en el curso</p>
    </header>

    <div class="buscador">
      <input
        type="text"
        id="buscador-input"
        placeholder="Buscar un evento..."
      />
    </div>

    <main>
      <article class="evento">
        <div class="fecha">
          <span class="dia">12</span> <span class="mes">OCT</span>
        </div>
        <div class="info">
          <h2>Taller de Git</h2>
          <p>18:00 hs · Aula 3</p>
        </div>
      </article>

      <article class="evento">
        <div class="fecha">
          <span class="dia">19</span> <span class="mes">OCT</span>
        </div>
        <div class="info">
          <h2>Trabajo en equipo con GitHub</h2>
          <p>18:30 hs · Auditorio</p>
        </div>
      </article>

      <article class="evento">
        <div class="fecha">
          <span class="dia">26</span> <span class="mes">OCT</span>
        </div>
        <div class="info">
          <h2>Meetup de proyectos</h2>
          <p>19:00 hs · Sala común</p>
        </div>
      </article>
    </main>

    <script>
      const buscador = document.getElementById("buscador-input");
      const eventos = document.querySelectorAll(".evento");

      buscador.addEventListener("input", () => {
        const texto = buscador.value.toLowerCase();

        eventos.forEach((evento) => {
          const titulo = evento.querySelector("h2").textContent.toLowerCase();
          evento.style.display = titulo.includes(texto) ? "flex" : "none";
        });
      });
    </script>
  </body>
</html>
